<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Content Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface2: #1e1e1e;
      --border: rgba(255,255,255,0.07);
      --accent: #e8ff57;
      --text: #f0ede6;
      --muted: #888;
      --font-d: 'Syne', sans-serif;
      --font-b: 'DM Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-b); min-height: 100vh; }

    /* HEADER */
    header {
      padding: 1.5rem 2rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
    }
    header h1 { font-family: var(--font-d); font-size: 24px; font-weight: 800; }
    header h1 span { color: var(--accent); }
    header p { font-size: 13px; color: var(--muted); margin-top: 3px; font-weight: 300; }

    .stats-bar { display: flex; gap: 1px; background: var(--border); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
    .stat { background: var(--surface); padding: 8px 16px; text-align: center; }
    .stat-num { font-family: var(--font-d); font-size: 20px; font-weight: 700; line-height: 1; }
    .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* TABS */
    .tabs-bar { display: flex; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
    .tabs-bar::-webkit-scrollbar { display: none; }
    .tab {
      font-family: var(--font-d); font-size: 12px; font-weight: 700;
      padding: 14px 20px; border: none; background: transparent; color: var(--muted);
      cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent;
      transition: all 0.15s; display: flex; align-items: center; gap: 8px;
      position: relative; top: 1px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .tab-count { font-size: 10px; padding: 2px 6px; border-radius: 8px; background: rgba(255,255,255,0.07); color: var(--muted); }
    .tab.active .tab-count { background: rgba(232,255,87,0.15); color: var(--accent); }

    /* STATUS FILTERS */
    .toolbar { display: flex; align-items: center; gap: 8px; padding: 12px 2rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .sf {
      font-size: 12px; font-weight: 500; padding: 5px 14px; border-radius: 20px;
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      cursor: pointer; transition: all 0.15s;
    }
    .sf:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    .sf.active { background: var(--surface2); color: var(--text); border-color: rgba(255,255,255,0.25); }

    /* GRID */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1px; background: var(--border); }
    .card { background: var(--surface); padding: 1.25rem; transition: background 0.12s; }
    .card:hover { background: var(--surface2); }

    .card-type { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .card-title { font-family: var(--font-d); font-size: 15px; font-weight: 700; line-height: 1.3; margin-bottom: 12px; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .card-date { font-size: 11px; color: var(--muted); }

    .pill { font-size: 10px; font-weight: 600; padding: 3px 10px; border-radius: 12px; }
    .s-idea      { background: rgba(136,136,136,0.15); color: #888; }
    .s-script    { background: rgba(255,107,53,0.15);  color: #ff6b35; }
    .s-review    { background: rgba(255,200,40,0.15);  color: #ffc828; }
    .s-published { background: rgba(232,255,87,0.2);   color: #c8e000; }

    .progress-bar { height: 2px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
    .progress-fill { height: 100%; border-radius: 2px; }

    .card-links { display: flex; gap: 8px; flex-wrap: wrap; }
    .link-btn {
      font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      text-decoration: none; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px;
    }
    .link-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }
    .link-btn.video { border-color: rgba(232,255,87,0.3); color: var(--accent); }
    .link-btn.video:hover { background: rgba(232,255,87,0.08); }
    .link-btn.story { border-color: rgba(100,160,255,0.3); color: #64a0ff; }
    .link-btn.story:hover { background: rgba(100,160,255,0.08); }

    .empty { grid-column: 1/-1; text-align: center; padding: 5rem 1rem; color: var(--muted); }
    .empty strong { display: block; font-family: var(--font-d); font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 8px; }

    .loader { text-align: center; padding: 4rem; color: var(--muted); font-size: 14px; }

    footer { text-align: center; padding: 2rem; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); margin-top: 2rem; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Content <span>Studio</span></h1>
    <p>Suivez toutes les vidéos en cours de production</p>
  </div>
  <div class="stats-bar" id="stats"></div>
</header>

<nav class="tabs-bar" id="tabs"></nav>

<div class="toolbar" id="toolbar">
  <button class="sf active" data-s="all">All statuses</button>
  <button class="sf" data-s="idea">Idea</button>
  <button class="sf" data-s="script">Script &amp; editing</button>
  <button class="sf" data-s="review">Review</button>
  <button class="sf" data-s="published">Published</button>
</div>

<main class="grid" id="grid">
  <div class="loader">Chargement des vidéos…</div>
</main>

<footer>Content Studio &mdash; Vue publique &mdash; Lecture seule</footer>

<script>
  // ─── SUPABASE CONFIG ───────────────────────────────────────────────────────
  const SUPABASE_URL = 'https://fbxnriidaiyoxgygoipf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_5QPdGaRabkY_zTdUvlPoVw_65BA1yzz';
  // ──────────────────────────────────────────────────────────────────────────

  const TABS = [
    { key: 'tutorial-platform',  label: 'Tutorial platform',  color: '#e8ff57' },
    { key: 'tutorial-mobile',    label: 'Tutorial mobile app',color: '#ff6b35' },
    { key: 'short-mobile',       label: 'Short mobile app',   color: '#64a0ff' },
    { key: 'other',              label: 'Other',              color: '#a264ff' },
  ];

  const STATUS_PROGRESS = { idea: 10, script: 45, review: 80, published: 100 };
  const STATUS_LABEL    = { idea: 'Idea', script: 'Script & editing', review: 'Review', published: 'Published' };

  let videos = [];
  let activeTab = TABS[0].key;
  let activeStatus = 'all';

  async function fetchVideos() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/videos?select=*&order=created_at.desc`, {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
    });
    videos = await res.json();
    render();
  }

  function filtered() {
    return videos.filter(v =>
      v.category === activeTab &&
      (activeStatus === 'all' || v.status === activeStatus)
    );
  }

  function renderStats() {
    const total = videos.length;
    const live  = videos.filter(v => v.status === 'published').length;
    const prod  = videos.filter(v => v.status === 'script').length;
    const plan  = videos.filter(v => v.status === 'idea').length;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">Total</div></div>
      <div class="stat"><div class="stat-num" style="color:var(--accent)">${live}</div><div class="stat-label">Live</div></div>
      <div class="stat"><div class="stat-num" style="color:#ff6b35">${prod}</div><div class="stat-label">En prod</div></div>
      <div class="stat"><div class="stat-num" style="color:#888">${plan}</div><div class="stat-label">Planifié</div></div>
    `;
  }

  function renderTabs() {
    document.getElementById('tabs').innerHTML = TABS.map(t => {
      const count = videos.filter(v => v.category === t.key).length;
      return `<button class="tab${t.key === activeTab ? ' active' : ''}" data-tab="${t.key}">
        <span class="tab-dot" style="background:${t.color}"></span>
        ${t.label}
        <span class="tab-count">${count}</span>
      </button>`;
    }).join('');
    document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
      activeTab = b.dataset.tab; render();
    }));
  }

  function renderGrid() {
    const list = filtered();
    const color = (TABS.find(t => t.key === activeTab) || {}).color || '#888';
    if (!list.length) {
      document.getElementById('grid').innerHTML = `<div class="empty"><strong>Rien ici pour l'instant</strong>Aucune vidéo dans cette catégorie.</div>`;
      return;
    }
    document.getElementById('grid').innerHTML = list.map(v => {
      const pct = STATUS_PROGRESS[v.status] || 0;
      const dateStr = v.target_date ? new Date(v.target_date + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
      const videoBtn = v.video_url ? `<a class="link-btn video" href="${v.video_url}" target="_blank" rel="noopener">▶ Regarder</a>` : '';
      const storyBtn = v.storyboard_url ? `<a class="link-btn story" href="${v.storyboard_url}" target="_blank" rel="noopener">📄 Storyboard</a>` : '';
      return `<div class="card">
        <div class="card-type"><span class="tab-dot" style="background:${color}"></span><span style="color:${color}">${TABS.find(t=>t.key===v.category)?.label || v.category}</span></div>
        <div class="card-title">${v.title}</div>
        <div class="card-meta">
          <span class="pill s-${v.status}">${STATUS_LABEL[v.status] || v.status}</span>
          <span class="card-date">${dateStr}</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
        ${(videoBtn || storyBtn) ? `<div class="card-links">${videoBtn}${storyBtn}</div>` : ''}
      </div>`;
    }).join('');
  }

  function render() { renderStats(); renderTabs(); renderGrid(); }

  document.getElementById('toolbar').addEventListener('click', e => {
    const btn = e.target.closest('.sf');
    if (!btn) return;
    document.querySelectorAll('.sf').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeStatus = btn.dataset.s;
    renderGrid();
  });

  // Realtime updates via polling every 30s
  fetchVideos();
  setInterval(fetchVideos, 30000);
</script>
</body>
</html>
